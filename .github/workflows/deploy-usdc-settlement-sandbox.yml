name: Deploy USDC settlement sandbox

on:
  workflow_dispatch:
    inputs:
      network:
        description: Sandbox EVM network
        required: true
        type: choice
        options:
          - base-sepolia
          - polygon-amoy
      quote_signer_address:
        description: Public VAD quote signer address
        required: true
        type: string
      settlement_signer_address:
        description: Public VAD settlement signer address
        required: true
        type: string
      resolver_address:
        description: Public VAD resolver address
        required: true
        type: string
      treasury_address:
        description: Public VAD treasury address
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_TESTNET to continue
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_TESTNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/evm

    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve sandbox network
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.network }}" in
            base-sepolia)
              echo "RPC_URL=https://sepolia.base.org" >> "$GITHUB_ENV"
              echo "EXPECTED_CHAIN_ID=84532" >> "$GITHUB_ENV"
              echo "CHAIN_CODE=BASE_SEPOLIA" >> "$GITHUB_ENV"
              echo "USDC_ADDRESS=0x036CbD53842c5426634e7929541eC2318f3dCF7e" >> "$GITHUB_ENV"
              ;;
            polygon-amoy)
              echo "RPC_URL=https://rpc-amoy.polygon.technology/" >> "$GITHUB_ENV"
              echo "EXPECTED_CHAIN_ID=80002" >> "$GITHUB_ENV"
              echo "CHAIN_CODE=POLYGON_AMOY" >> "$GITHUB_ENV"
              echo "USDC_ADDRESS=0x41E94Eb019C0762f9Bfcf9Fb1E58725BfB0e7582" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported sandbox network"
              exit 1
              ;;
          esac

      - name: Validate public role addresses
        shell: bash
        env:
          QUOTE_SIGNER: ${{ inputs.quote_signer_address }}
          SETTLEMENT_SIGNER: ${{ inputs.settlement_signer_address }}
          RESOLVER: ${{ inputs.resolver_address }}
          TREASURY: ${{ inputs.treasury_address }}
        run: |
          set -euo pipefail
          for value in "$QUOTE_SIGNER" "$SETTLEMENT_SIGNER" "$RESOLVER" "$TREASURY"; do
            if [[ ! "$value" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "Every role must be a valid public EVM address."
              exit 1
            fi
          done

      - name: Validate deployer and network
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.VAD_EVM_TESTNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$PRIVATE_KEY" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "Missing or invalid VAD_EVM_TESTNET_DEPLOYER_PRIVATE_KEY repository secret."
            exit 1
          fi

          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"

          if [[ "$CHAIN_ID" != "$EXPECTED_CHAIN_ID" ]]; then
            echo "RPC chain mismatch: expected $EXPECTED_CHAIN_ID but received $CHAIN_ID."
            exit 1
          fi

          BALANCE="$(cast balance "$DEPLOYER" --rpc-url "$RPC_URL")"
          if [[ "$BALANCE" == "0" ]]; then
            echo "The testnet deployer has no native gas token. Fund $DEPLOYER from a faucet first."
            exit 1
          fi

          TOKEN_CODE="$(cast code "$USDC_ADDRESS" --rpc-url "$RPC_URL")"
          if [[ -z "$TOKEN_CODE" || "$TOKEN_CODE" == "0x" ]]; then
            echo "The configured USDC test token is not a contract on this RPC."
            exit 1
          fi

          echo "DEPLOYER_ADDRESS=$DEPLOYER" >> "$GITHUB_ENV"

      - name: Build and test settlement contract
        run: |
          set -euo pipefail
          forge build
          forge test -vvv

      - name: Deploy VAD Settlement V1
        id: deploy
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.VAD_EVM_TESTNET_DEPLOYER_PRIVATE_KEY }}
          QUOTE_SIGNER: ${{ inputs.quote_signer_address }}
          SETTLEMENT_SIGNER: ${{ inputs.settlement_signer_address }}
          RESOLVER: ${{ inputs.resolver_address }}
          TREASURY: ${{ inputs.treasury_address }}
        run: |
          set -euo pipefail

          OUTPUT="$(
            forge create src/VadSettlementV1.sol:VadSettlementV1 \
              --rpc-url "$RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              --broadcast \
              --constructor-args \
                "$USDC_ADDRESS" \
                "$DEPLOYER_ADDRESS" \
                "$QUOTE_SIGNER" \
                "$SETTLEMENT_SIGNER" \
                "$RESOLVER" \
                "$TREASURY" \
              2>&1
          )"

          echo "$OUTPUT"

          CONTRACT_ADDRESS="$(printf '%s\n' "$OUTPUT" | awk '/Deployed to:/ {print $3}' | tail -n 1)"
          TRANSACTION_HASH="$(printf '%s\n' "$OUTPUT" | awk '/Transaction hash:/ {print $3}' | tail -n 1)"

          if [[ ! "$CONTRACT_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "Could not determine the deployed contract address."
            exit 1
          fi

          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> "$GITHUB_ENV"
          echo "contract_address=$CONTRACT_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=$TRANSACTION_HASH" >> "$GITHUB_OUTPUT"

      - name: Verify deployed configuration
        shell: bash
        env:
          QUOTE_SIGNER: ${{ inputs.quote_signer_address }}
          SETTLEMENT_SIGNER: ${{ inputs.settlement_signer_address }}
          RESOLVER: ${{ inputs.resolver_address }}
          TREASURY: ${{ inputs.treasury_address }}
        run: |
          set -euo pipefail

          TOKEN="$(cast call "$CONTRACT_ADDRESS" 'settlementToken()(address)' --rpc-url "$RPC_URL")"
          ADMIN="$(cast call "$CONTRACT_ADDRESS" 'admin()(address)' --rpc-url "$RPC_URL")"
          QUOTE="$(cast call "$CONTRACT_ADDRESS" 'quoteSigner()(address)' --rpc-url "$RPC_URL")"
          SETTLEMENT="$(cast call "$CONTRACT_ADDRESS" 'settlementSigner()(address)' --rpc-url "$RPC_URL")"
          RESOLVE="$(cast call "$CONTRACT_ADDRESS" 'resolver()(address)' --rpc-url "$RPC_URL")"
          TREASURY_ONCHAIN="$(cast call "$CONTRACT_ADDRESS" 'treasury()(address)' --rpc-url "$RPC_URL")"

          [[ "${TOKEN,,}" == "${USDC_ADDRESS,,}" ]]
          [[ "${ADMIN,,}" == "${DEPLOYER_ADDRESS,,}" ]]
          [[ "${QUOTE,,}" == "${QUOTE_SIGNER,,}" ]]
          [[ "${SETTLEMENT,,}" == "${SETTLEMENT_SIGNER,,}" ]]
          [[ "${RESOLVE,,}" == "${RESOLVER,,}" ]]
          [[ "${TREASURY_ONCHAIN,,}" == "${TREASURY,,}" ]]

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## VAD Settlement V1 sandbox deployment"
            echo ""
            echo "- Network: $CHAIN_CODE"
            echo "- Contract: $CONTRACT_ADDRESS"
            echo "- Settlement token: $USDC_ADDRESS"
            echo "- Admin/deployer: $DEPLOYER_ADDRESS"
            echo "- Status in VAD: not registered / not activated automatically"
            echo ""
            echo "Next: register this public deployment in VAD Admin > Crypto Networks. Keep it DISABLED until signer secrets and end-to-end testing are verified."
          } >> "$GITHUB_STEP_SUMMARY"
