name: Validate Dynamic Android bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-dynamic-native.yml
      - apps/mobile/package.json
      - package-lock.json
      - packages/chain-core/**
      - apps/mobile/app.json
      - apps/mobile/src/lib/dynamic-client.native.ts
      - apps/mobile/src/lib/dynamic-session.native.ts
      - apps/mobile/src/services/dynamic-wallet-adapter.native.ts
      - apps/mobile/src/features/wallet/crypto-wallet-connections.native.tsx
      - apps/mobile/src/providers/auth-provider.tsx
      - apps/mobile/.env.example
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-dynamic-native.yml
      - apps/mobile/package.json
      - package-lock.json
      - apps/mobile/app.json
      - apps/mobile/src/lib/dynamic-client.native.ts
      - apps/mobile/src/lib/dynamic-session.native.ts
      - apps/mobile/src/features/wallet/crypto-wallet-connections.native.tsx
      - apps/mobile/src/providers/auth-provider.tsx
      - apps/mobile/.env.example

permissions:
  contents: read

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export Android bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_DYNAMIC_ENVIRONMENT_ID: b7adb778-e5f7-4f7c-952d-a7daa651c030
        run: npx expo export --platform android --output-dir /tmp/vad-dynamic-android
      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_DYNAMIC_ENVIRONMENT_ID: b7adb778-e5f7-4f7c-952d-a7daa651c030
        run: npx expo prebuild --platform android --no-install --non-interactive
