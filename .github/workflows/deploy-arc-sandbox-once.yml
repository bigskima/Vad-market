name: Deploy Arc sandbox once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-arc-sandbox-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/evm

    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Validate Arc deployer and network
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.VAD_EVM_TESTNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          RPC_URL="https://rpc.testnet.arc.network"
          EXPECTED_CHAIN_ID="5042002"
          USDC_ADDRESS="0x3600000000000000000000000000000000000000"

          if [[ ! "$PRIVATE_KEY" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "Missing or invalid VAD_EVM_TESTNET_DEPLOYER_PRIVATE_KEY."
            exit 1
          fi

          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"
          BALANCE="$(cast balance "$DEPLOYER" --rpc-url "$RPC_URL")"
          TOKEN_CODE="$(cast code "$USDC_ADDRESS" --rpc-url "$RPC_URL")"

          if [[ "$CHAIN_ID" != "$EXPECTED_CHAIN_ID" ]]; then
            echo "Arc chain mismatch: expected $EXPECTED_CHAIN_ID, received $CHAIN_ID."
            exit 1
          fi

          if [[ "$BALANCE" == "0" ]]; then
            echo "Arc deployer has no native USDC gas balance: $DEPLOYER"
            exit 1
          fi

          if [[ -z "$TOKEN_CODE" || "$TOKEN_CODE" == "0x" ]]; then
            echo "Arc testnet USDC contract is unavailable at $USDC_ADDRESS."
            exit 1
          fi

          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"
          echo "USDC_ADDRESS=$USDC_ADDRESS" >> "$GITHUB_ENV"
          echo "DEPLOYER_ADDRESS=$DEPLOYER" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -euo pipefail
          forge build
          forge test -vvv

      - name: Deploy VAD Settlement V1
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.VAD_EVM_TESTNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          OUTPUT="$(
            forge create src/VadSettlementV1.sol:VadSettlementV1 \
              --rpc-url "$RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              --broadcast \
              --constructor-args \
                "$USDC_ADDRESS" \
                "$DEPLOYER_ADDRESS" \
                "$DEPLOYER_ADDRESS" \
                "$DEPLOYER_ADDRESS" \
                "$DEPLOYER_ADDRESS" \
                "$DEPLOYER_ADDRESS" \
              2>&1
          )"

          echo "$OUTPUT"

          CONTRACT_ADDRESS="$(printf '%s\n' "$OUTPUT" | awk '/Deployed to:/ {print $3}' | tail -n 1)"
          TX_HASH="$(printf '%s\n' "$OUTPUT" | awk '/Transaction hash:/ {print $3}' | tail -n 1)"

          if [[ ! "$CONTRACT_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "Could not determine deployed contract address."
            exit 1
          fi

          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> "$GITHUB_ENV"
          echo "TX_HASH=$TX_HASH" >> "$GITHUB_ENV"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(cast call "$CONTRACT_ADDRESS" 'settlementToken()(address)' --rpc-url "$RPC_URL")"
          ADMIN="$(cast call "$CONTRACT_ADDRESS" 'admin()(address)' --rpc-url "$RPC_URL")"
          QUOTE="$(cast call "$CONTRACT_ADDRESS" 'quoteSigner()(address)' --rpc-url "$RPC_URL")"
          SETTLEMENT="$(cast call "$CONTRACT_ADDRESS" 'settlementSigner()(address)' --rpc-url "$RPC_URL")"
          RESOLVER="$(cast call "$CONTRACT_ADDRESS" 'resolver()(address)' --rpc-url "$RPC_URL")"
          TREASURY="$(cast call "$CONTRACT_ADDRESS" 'treasury()(address)' --rpc-url "$RPC_URL")"

          [[ "${TOKEN,,}" == "${USDC_ADDRESS,,}" ]]
          [[ "${ADMIN,,}" == "${DEPLOYER_ADDRESS,,}" ]]
          [[ "${QUOTE,,}" == "${DEPLOYER_ADDRESS,,}" ]]
          [[ "${SETTLEMENT,,}" == "${DEPLOYER_ADDRESS,,}" ]]
          [[ "${RESOLVER,,}" == "${DEPLOYER_ADDRESS,,}" ]]
          [[ "${TREASURY,,}" == "${DEPLOYER_ADDRESS,,}" ]]

          {
            echo "## ARC_DEPLOYMENT_RESULT"
            echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS"
            echo "TX_HASH=$TX_HASH"
            echo "DEPLOYER_ADDRESS=$DEPLOYER_ADDRESS"
            echo "USDC_ADDRESS=$USDC_ADDRESS"
          } >> "$GITHUB_STEP_SUMMARY"
