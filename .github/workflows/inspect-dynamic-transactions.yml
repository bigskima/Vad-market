name: Inspect Dynamic transaction APIs

on:
  push:
    branches: [usdc-settlement-v1]
    paths:
      - .github/workflows/inspect-dynamic-transactions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: usdc-settlement-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect declaration APIs only
        run: |
          for term in "sendTransaction" "signTypedData" "signMessage" "getWalletAccounts" "WalletAccount" "switchNetwork"; do
            echo "===== $term ====="
            find node_modules/@dynamic-labs-sdk -type f \( -name '*.d.ts' -o -name '*.d.mts' \) -print0               | xargs -0 grep -n -m 20 "$term" 2>/dev/null               | head -n 160 || true
          done
