name: Inspect Dynamic transaction APIs

on:
  push:
    branches: [usdc-settlement-v1]
    paths:
      - .github/workflows/inspect-dynamic-transactions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: usdc-settlement-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect exact transaction declarations
        run: |
          for file in             node_modules/@dynamic-labs-sdk/client/dist/modules/wallets/walletProvider/walletProvider.types.d.ts             node_modules/@dynamic-labs-sdk/client/dist/modules/wallets/walletAccount/walletAccount.types.d.ts             node_modules/@dynamic-labs-sdk/client/dist/modules/wallets/walletAccount/BaseWalletAccount.types.d.ts             node_modules/@dynamic-labs-sdk/evm/dist/EvmWalletProvider.types.d.ts             node_modules/@dynamic-labs-sdk/evm/dist/EvmWalletAccount.types.d.ts             node_modules/@dynamic-labs-sdk/solana/dist/SolanaWalletProvider.types.d.ts             node_modules/@dynamic-labs-sdk/solana/dist/SolanaWalletAccount.types.d.ts             node_modules/@dynamic-labs-sdk/solana/dist/signAndSendTransaction/signAndSendTransaction.d.ts; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
            fi
          done
          echo "===== EVM transaction declaration files ====="
          find node_modules/@dynamic-labs-sdk/evm/dist -type f -name '*.d.ts' -print0             | xargs -0 grep -l "sendTransaction" 2>/dev/null | head -n 20
