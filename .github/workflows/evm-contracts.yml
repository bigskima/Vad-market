name: EVM Contract Tests

on:
  push:
    paths:
      - "contracts/evm/**"
      - ".github/workflows/evm-contracts.yml"
  pull_request:
    paths:
      - "contracts/evm/**"
      - ".github/workflows/evm-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile EVM contracts and deployment script
        run: forge build --root contracts/evm
      - name: Run settlement lifecycle and security tests
        run: forge test --root contracts/evm -vvv
