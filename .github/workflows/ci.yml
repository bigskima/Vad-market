name: VAD CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - id: lint
        continue-on-error: true
        run: npm run lint
      - if: steps.lint.outcome == 'failure'
        run: npm run lint > lint-output.txt 2>&1 || true
      - if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint-output.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### VAD CI lint report\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - run: npm test --if-present
      - if: steps.lint.outcome == 'failure'
        run: exit 1
