name: VAD CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - id: lint
        continue-on-error: true
        run: npm run lint
      - if: steps.lint.outcome == 'failure'
        run: npx eslint apps/mobile/src --format json --output-file lint-report.json || true
      - if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
      - run: npm test --if-present
      - if: steps.lint.outcome == 'failure'
        run: exit 1
