name: VAD CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Set up Deno for Oracle runtime checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check automatic Oracle and settlement resolution adapters
        run: deno check --no-lock supabase/functions/oracle-runtime/index.ts
      - name: Type-check automatic AI evidence resolution worker
        run: deno check --no-lock supabase/functions/market-resolution-worker/index.ts
      - name: Test AI resolution evidence-path coverage
        run: deno test --no-lock supabase/functions/market-resolution-worker/evidence-coverage_test.ts
      - name: Type-check location verification endpoint
        run: deno check --no-lock supabase/functions/verify-service-location/index.ts
      - name: Type-check authenticated crypto AI draft endpoint
        run: deno check --no-lock supabase/functions/crypto-market-draft/index.ts
      - name: Type-check custom market AI draft and autonomous agent endpoints
        run: deno check --no-lock supabase/functions/custom-market-draft/index.ts supabase/functions/market-agent-api/index.ts
      - name: Type-check public financial data and event-discovery adapters
        run: deno check --no-lock supabase/functions/financial-market-data/index.ts supabase/functions/market-event-discovery/index.ts
      - name: Type-check public news, source-image and image-worker adapters
        run: deno check --no-lock supabase/functions/news-feed/index.ts supabase/functions/market-source-image/index.ts supabase/functions/market-image-worker/index.ts
      - name: Type-check crypto Oracle asset coverage endpoint
        run: deno check --no-lock supabase/functions/crypto-oracle-asset-check/index.ts
      - name: Test Oracle resolver policy and financial symbol parsing
        run: deno test --no-lock supabase/functions/oracle-runtime/resolvers_test.ts
      - id: lint
        continue-on-error: true
        run: npm run lint
      - if: steps.lint.outcome == 'failure'
        run: npm run lint > lint-output.txt 2>&1 || true
      - if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint-output.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### VAD CI lint report\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - run: npm test --if-present
      - run: npm run build:web
      - if: steps.lint.outcome == 'failure'
        run: exit 1

  migration-terminator-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard SQL migration dollar-quote terminators
        run: npm run check:sql-migrations

  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase stack
        run: npm run db:start
      - name: Replay all migrations against local PostgreSQL
        run: npm run db:reset -- --local --no-seed
      - name: Stop local Supabase stack
        if: always()
        run: npm run db:stop -- --no-backup
