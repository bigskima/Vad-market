name: Inspect Dynamic exact APIs

on:
  push:
    branches: [dynamic-email-wallet]
    paths:
      - .github/workflows/inspect-dynamic-exact.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-email-wallet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Dynamic declarations
        run: |
          files=(
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/hooks/wrappers/functions/useSendEmailOTP/useSendEmailOTP.d.ts"
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/hooks/wrappers/functions/useVerifyOTP/useVerifyOTP.d.ts"
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/hooks/wrappers/functions/useGetWalletAccounts/useGetWalletAccounts.d.ts"
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/hooks/wrappers/functions/useCreateWaasWalletAccounts/useCreateWaasWalletAccounts.d.ts"
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/hooks/wrappers/functions/useLogout/useLogout.d.ts"
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/hooks/useDynamicClient/useDynamicClient.d.ts"
            "node_modules/@dynamic-labs-sdk/react-hooks/dist/providers/DynamicProvider/DynamicProvider.d.ts"
          )
          for f in "${files[@]}"; do
            echo "===== $f ====="
            if [ -f "$f" ]; then cat "$f"; else echo "MISSING"; fi
          done
          echo "===== client package exports ====="
          cat node_modules/@dynamic-labs-sdk/client/package.json
          echo "===== react-hooks package exports ====="
          cat node_modules/@dynamic-labs-sdk/react-hooks/package.json
