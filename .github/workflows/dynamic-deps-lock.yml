name: Dynamic dependency lock

on:
  push:
    branches: [dynamic-email-wallet]
    paths:
      - .github/workflows/dynamic-deps-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-email-wallet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Dynamic React Native dependencies
        working-directory: apps/mobile
        run: |
          npx expo install             @dynamic-labs-sdk/client             @dynamic-labs-sdk/react-hooks             @dynamic-labs-sdk/evm             @dynamic-labs-sdk/solana             @tanstack/react-query             @react-native-async-storage/async-storage             react-native-keychain             expo-crypto             buffer
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install Dynamic native wallet dependencies"
          git push origin HEAD:dynamic-email-wallet
