name: Inspect Dynamic SDK types

on:
  push:
    branches: [dynamic-email-wallet]
    paths:
      - .github/workflows/inspect-dynamic-sdk.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-email-wallet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect native SDK declarations
        run: |
          echo "===== CLIENT CONFIG ====="
          cat node_modules/@dynamic-labs-sdk/client/dist/client/createDynamicClient/createDynamicClient.d.ts || true
          grep -R -n --include='*.d.ts' -m 6 "interface DynamicClientConfig\|type DynamicClientConfig" node_modules/@dynamic-labs-sdk/client/dist || true
          echo "===== USER ====="
          find node_modules/@dynamic-labs-sdk/react-hooks/dist -path '*useUser*' -name '*.d.ts' -maxdepth 8 -print -exec cat {} \; 2>/dev/null || true
          echo "===== INIT ====="
          find node_modules/@dynamic-labs-sdk/react-hooks/dist -path '*useInitStatus*' -name '*.d.ts' -maxdepth 8 -print -exec cat {} \; 2>/dev/null || true
          echo "===== PROVIDER ====="
          cat node_modules/@dynamic-labs-sdk/react-hooks/dist/modules/DynamicContext/DynamicProvider.d.ts || true
          echo "===== EVM WAAS ====="
          find node_modules/@dynamic-labs-sdk/evm -path '*waas*' -name '*.d.ts' -maxdepth 8 -print -exec cat {} \; 2>/dev/null | head -n 500
          echo "===== SOLANA WAAS ====="
          find node_modules/@dynamic-labs-sdk/solana -path '*waas*' -name '*.d.ts' -maxdepth 8 -print -exec cat {} \; 2>/dev/null | head -n 500
          echo "===== WAAS CREATE ====="
          cat node_modules/@dynamic-labs-sdk/client/dist/modules/waas/createWaasWalletAccounts/createWaasWalletAccounts.d.ts || true
          cat node_modules/@dynamic-labs-sdk/client/dist/modules/waas/getChainsMissingWaasWalletAccounts/getChainsMissingWaasWalletAccounts.d.ts || true
          echo "===== WALLET ACCOUNT ====="
          grep -R -n --include='*.d.ts' -m 15 "interface WalletAccount\|type WalletAccount" node_modules/@dynamic-labs-sdk/client/dist | head -n 40 || true
